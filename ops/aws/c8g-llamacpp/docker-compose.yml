services:
  llamacpp:
    image: ${LLAMACPP_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - ${GGUF_MODEL_PATH}
      - --alias
      - ${SERVED_MODEL_NAME}
      - --ctx-size
      - "${N_CTX}"
      - --threads
      - "${N_THREADS}"
      - --api-key
      - ${LLAMACPP_API_KEY}
    ports:
      - "${LLAMACPP_PORT}:8080"
    volumes:
      - ./models:/models:ro
