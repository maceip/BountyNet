services:
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --model
      - ${VLLM_MODEL}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME}
      - --host
      - 0.0.0.0
      - --port
      - ${VLLM_PORT}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION}
      - --max-model-len
      - ${MAX_MODEL_LEN}
      - --tensor-parallel-size
      - ${TENSOR_PARALLEL_SIZE}
      - --api-key
      - ${VLLM_API_KEY}
    expose:
      - "8000"
    volumes:
      - ${VLLM_MODEL}:${VLLM_MODEL}:ro
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

  adapter-router:
    image: python:3.12-slim
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VLLM_UPSTREAM_BASE: "http://vllm:8000"
      ADAPTER_ROUTER_PORT: "8010"
    command:
      - /bin/sh
      - -lc
      - pip install --no-cache-dir flask && python /app/adapter_router.py
    ports:
      - "${VLLM_PORT}:8010"
    volumes:
      - ./adapter_router.py:/app/adapter_router.py:ro
      - ./adapter-manifest.json:/etc/bountynet/adapter-manifest.json:ro
    depends_on:
      - vllm
