services:
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --model
      - ${VLLM_MODEL}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME}
      - --host
      - 0.0.0.0
      - --port
      - ${VLLM_PORT}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION}
      - --max-model-len
      - ${MAX_MODEL_LEN}
      - --tensor-parallel-size
      - ${TENSOR_PARALLEL_SIZE}
      - --api-key
      - ${VLLM_API_KEY}
    ports:
      - "${VLLM_PORT}:8000"
    volumes:
      - ${VLLM_MODEL}:${VLLM_MODEL}:ro
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
