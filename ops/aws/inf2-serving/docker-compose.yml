services:
  vllm:
    image: ${RUNTIME_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --model
      - ${VLLM_MODEL}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY}
      - --max-model-len
      - "32768"
      - --enable-prefix-caching
      - --disable-log-stats
    expose:
      - "8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

  adapter-router:
    image: python:3.12-slim
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VLLM_UPSTREAM_BASE: http://vllm:8000
      ADAPTER_ROUTER_PORT: "8010"
    command:
      - /bin/sh
      - -lc
      - pip install --no-cache-dir flask && python /app/adapter_router.py
    ports:
      - "${VLLM_PORT}:8010"
    depends_on:
      - vllm
    volumes:
      - ./adapter_router.py:/app/adapter_router.py:ro
      - ./adapter-manifest.json:/etc/bountynet/adapter-manifest.json:ro
