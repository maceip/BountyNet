#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - jq

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable docker
  - systemctl start docker
  - mkdir -p /opt/bountynet-control
  - mkdir -p /opt/bountynet-control/data
  - chown -R root:root /opt/bountynet-control
