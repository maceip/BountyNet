services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - langfuse-web

  gateway:
    build:
      context: ../../..
      dockerfile: docker/gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GATEWAY_PORT: "8090"
      BOUNTYNET_DATA_DIR: /var/lib/bountynet
      BOUNTYNET_DB_PATH: /var/lib/bountynet/gateway.db
      AGENT_RUNTIME_PROVIDER: litellm
      AGENT_RUNTIME_API_BASE: http://litellm:4000
      AGENT_RUNTIME_MODEL: agents/default
      AGENT_RUNTIME_REASONING_EFFORT: medium
    volumes:
      - gateway_data:/var/lib/bountynet
    expose:
      - "8090"
    depends_on:
      - litellm

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    command:
      - "--config"
      - "/app/config/litellm.config.yaml"
      - "--port"
      - "4000"
    env_file:
      - .env
    volumes:
      - ./litellm.config.yaml:/app/config/litellm.config.yaml:ro
    expose:
      - "4000"
    depends_on:
      - langfuse-web

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command:
      - /bin/sh
      - -lc
      - redis-server --appendonly yes --requirepass "$${REDIS_AUTH}"
    env_file:
      - .env
    volumes:
      - redis_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:${CLICKHOUSE_PASSWORD}@clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      SALT: ${LANGFUSE_SALT}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://${LANGFUSE_DOMAIN}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      BLOB_STORAGE_S3_ENDPOINT: http://minio:9000
      BLOB_STORAGE_S3_REGION: us-east-1
      BLOB_STORAGE_S3_BUCKET: langfuse
      BLOB_STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      BLOB_STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      BLOB_STORAGE_S3_FORCE_PATH_STYLE: "true"
    expose:
      - "3000"
    depends_on:
      - postgres
      - redis
      - clickhouse
      - minio

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:${CLICKHOUSE_PASSWORD}@clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      SALT: ${LANGFUSE_SALT}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://${LANGFUSE_DOMAIN}
      TELEMETRY_ENABLED: "false"
      BLOB_STORAGE_S3_ENDPOINT: http://minio:9000
      BLOB_STORAGE_S3_REGION: us-east-1
      BLOB_STORAGE_S3_BUCKET: langfuse
      BLOB_STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      BLOB_STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      BLOB_STORAGE_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      - postgres
      - redis
      - clickhouse
      - minio

volumes:
  gateway_data:
  postgres_data:
  redis_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  caddy_data:
  caddy_config:
