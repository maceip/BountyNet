name: 'BountyNet Attest'
description: 'Attest CI outcomes to BountyNet using GitHub OIDC. Enables trustless bounty resolution.'
branding:
  icon: 'shield'
  color: 'orange'
inputs:
  gateway:
    description: 'BountyNet gateway URL'
    default: 'https://gateway.stare.network'
  context-hash:
    description: 'Override context hash (auto-generated if omitted)'
    required: false
outputs:
  context-hash:
    description: 'Deterministic hash identifying this CI run'
  oidc-hash:
    description: 'Hash of the GitHub OIDC token (for TEE signing chain)'
  attestation-id:
    description: 'Gateway attestation ID'
  principal:
    description: 'GitHub actor who triggered the run'
runs:
  using: 'node20'
  main: 'index.js'
