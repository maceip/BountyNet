model_list:
  - model_name: agents/default
    litellm_params:
      model: openai/base-coder
      api_base: os.environ/SGLANG_API_BASE
      api_key: os.environ/SGLANG_API_KEY

  - model_name: agents/ts-migrator
    litellm_params:
      model: openai/base-coder
      api_base: os.environ/SGLANG_API_BASE
      api_key: os.environ/SGLANG_API_KEY
      extra_body:
        metadata:
          agent_slug: ts-migrator
          adapter_id: ts-migrator

  - model_name: agents/ts-auditor
    litellm_params:
      model: openai/base-coder
      api_base: os.environ/SGLANG_API_BASE
      api_key: os.environ/SGLANG_API_KEY
      extra_body:
        metadata:
          agent_slug: ts-auditor
          adapter_id: ts-auditor

  - model_name: agents/ts-architect
    litellm_params:
      model: openai/base-coder
      api_base: os.environ/SGLANG_API_BASE
      api_key: os.environ/SGLANG_API_KEY
      extra_body:
        metadata:
          agent_slug: ts-architect
          adapter_id: ts-architect

  - model_name: agents/rust-porter
    litellm_params:
      model: openai/base-coder
      api_base: os.environ/SGLANG_API_BASE
      api_key: os.environ/SGLANG_API_KEY
      extra_body:
        metadata:
          agent_slug: rust-porter
          adapter_id: rust-porter

  - model_name: agents/rust-sentinel
    litellm_params:
      model: openai/base-coder
      api_base: os.environ/SGLANG_API_BASE
      api_key: os.environ/SGLANG_API_KEY
      extra_body:
        metadata:
          agent_slug: rust-sentinel
          adapter_id: rust-sentinel

  - model_name: agents/rust-optimizer
    litellm_params:
      model: openai/base-coder
      api_base: os.environ/SGLANG_API_BASE
      api_key: os.environ/SGLANG_API_KEY
      extra_body:
        metadata:
          agent_slug: rust-optimizer
          adapter_id: rust-optimizer

  - model_name: agents/fallback
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  allowed_fails: 1
  cooldown_time: 10
  fallbacks:
    - agents/default: ["agents/fallback"]
    - agents/ts-migrator: ["agents/fallback"]
    - agents/ts-auditor: ["agents/fallback"]
    - agents/ts-architect: ["agents/fallback"]
    - agents/rust-porter: ["agents/fallback"]
    - agents/rust-sentinel: ["agents/fallback"]
    - agents/rust-optimizer: ["agents/fallback"]

litellm_settings:
  request_timeout: 30
  num_retries: 0
  success_callback: ["langfuse"]
  json_logs: true
