apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-specialist
  namespace: bountynet-marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-specialist
  template:
    metadata:
      labels:
        app: vllm-specialist
    spec:
      containers:
        - name: vllm-specialist
          image: vllm/vllm-openai:latest
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --model
            - Qwen/Qwen3.6-35B-A3B
            - --api-key
            - replace-with-strong-key
            - --max-model-len
            - "32768"
            - --max-num-seqs
            - "256"
            - --gpu-memory-utilization
            - "0.95"
            - --tensor-parallel-size
            - "1"
            - --enable-prefix-caching
            - --enable-chunked-prefill
            - --speculative-model
            - Qwen/Qwen3.6-Flash
            - --num-speculative-tokens
            - "8"
            - --disable-log-stats
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-specialist
  namespace: bountynet-marketplace
spec:
  selector:
    app: vllm-specialist
  ports:
    - name: http
      port: 8000
      targetPort: 8000
