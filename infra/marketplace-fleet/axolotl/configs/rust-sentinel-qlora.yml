base_model: Qwen/Qwen2.5-Coder-32B-Instruct
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

load_in_4bit: true
adapter: qlora

datasets:
  - path: ./datasets/rust-sentinel-train.jsonl
    type: chat_template

output_dir: ./output/rust-sentinel
dataset_prepared_path: ./cache/rust-sentinel

sequence_len: 8192
sample_packing: true
pad_to_sequence_len: true

lora_r: 64
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

gradient_accumulation_steps: 8
micro_batch_size: 1
num_epochs: 3
optimizer: paged_adamw_8bit
lr_scheduler: cosine
learning_rate: 1.5e-4
train_on_inputs: false
group_by_length: true
bf16: true
tf32: true

flash_attention: true
gradient_checkpointing: true
