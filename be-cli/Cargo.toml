[package]
name = "bountynet-be"
version = "0.1.0"
edition = "2021"
description = "BountyNet CLI — binary `be` (short for BountyNet); calls gateway routes only"
license = "MIT"

[[bin]]
name = "be"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
open = "5"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"
