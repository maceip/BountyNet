name: Contracts
on:
  push:
    paths: ['contracts/**']
  pull_request:
    paths: ['contracts/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install moccasin
      - run: cd contracts && mox test
