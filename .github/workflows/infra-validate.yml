name: Infra Validate

on:
  pull_request:
    paths:
      - "infra/marketplace-fleet/**"
      - "ops/**"
      - ".github/workflows/infra-validate.yml"
  push:
    branches:
      - main
    paths:
      - "infra/marketplace-fleet/**"
      - "ops/**"
      - ".github/workflows/infra-validate.yml"

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/marketplace-fleet/terraform
    strategy:
      fail-fast: false
      matrix:
        module:
          - aws-global-accelerator
          - digitalocean-global-dns
          - digitalocean-global-lb
          - digitalocean-regional-lbs
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        run: terraform -chdir=${{ matrix.module }} init -backend=false
      - name: Terraform validate
        run: terraform -chdir=${{ matrix.module }} validate

  compose:
    name: Docker compose config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate soak compose
        run: docker compose -f docker-compose.soak.yml config > /dev/null
