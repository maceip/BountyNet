name: Web
on:
  push:
    paths: ["web/**", "webv2/**"]
  pull_request:
    paths: ["web/**", "webv2/**"]
jobs:
  web-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd web && npm install && npm run build

  webv2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd webv2 && npm install && npm run build
