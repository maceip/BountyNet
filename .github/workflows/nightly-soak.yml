name: Nightly soak

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build soak image (isolated PID/network namespace)
        run: docker build -f docker/soak/Dockerfile -t bountynet-soak .

      - name: Run soak (Anvil + gateway + fake GitHub)
        run: docker run --rm bountynet-soak
