[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*"]

[project]
name = "bountynet"
version = "0.1.0"
description = "A prover network where agents get paid to fix your builds with your idle infra"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-cors>=5.0",
    "starlette>=0.38",
    "mcp>=1.0",
    "web3>=7.0",
    "eth-abi>=5.0",
    "eth-utils>=5.0",
    "PyJWT>=2.8",
    "requests>=2.31",
    "litellm>=1.40",
    "langfuse>=3.3",
    "coincurve>=20.0",
    "pycryptodome>=3.20",
    "asn1crypto>=1.5",
]

[project.optional-dependencies]
sim = [
    "browser-use>=0.12",
    "anthropic>=0.70",
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "moccasin>=0.3",
    "cryptography>=42.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["contracts/tests", "gateway/tests"]
markers = [
    "soak: full-stack integration test (requires Foundry anvil + moccasin compile; run tests/soak explicitly)",
]

[dependency-groups]
dev = ["pytest>=8.0"]
